name: predictit_jr
description: A teaching app for Object-Oriented Mobile Application Development.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10    # SVG support for market images (used from A1)

  # Added in A3 (Navigation)
  go_router: ^14.0.0

  # Added in A4 (Provider)
  provider: ^6.1.0

  # Added in A6 (Persistence)
  shared_preferences: ^2.3.0

  # Added in A8 (Camera & GPS)
  image_picker: ^1.1.0
  geolocator: ^13.0.0
  permission_handler: ^11.3.0

  # Optional, for A3 price-history chart
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.0
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
    - assets/images/predictitjr_icon.png


# I got help from AI on this
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/predictitjr_icon.png"  # your source image
  adaptive_icon_background: "#1a1a2e"           # match your app's brand color
  adaptive_icon_foreground: "assets/images/predictitjr_icon.png"
  web:
    generate: false
  min_sdk_android: 21

flutter_native_splash:
  color: "#1a1a2e"              # background color while splash shows
  image: assets/images/predictitjr_icon.png
  color_dark: "#1a1a2e"
  image_dark: assets/images/predictitjr_icon.png
  android_12:
    image: assets/images/predictitjr_icon.png
    color: "#1a1a2e"
  fullscreen: true
